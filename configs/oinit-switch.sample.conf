# Configuration for oinit-switch, installed at /etc/oinit/oinit-switch.conf.
#
# oinit-switch runs on the SSH server and su's from the "oinit" service account
# to the account named in the certificate. As defence-in-depth it refuses to
# switch to any system user (uid < 100), INCLUDING root, unless that account is
# explicitly listed here.

# allow-users: comma- or whitespace-separated list of system users permitted as
# su targets. Non-system users (uid >= 100) are always permitted and do not need
# to be listed. Leave empty (or omit this file) to deny all system users.
#
# SECURITY RELEVANT: listing "root" here enables federated root logins. The CA
# must also be configured with allow-root for that host group, and PAM must
# permit the oinit -> root switch, for the login to succeed.
#
# allow-users = root
