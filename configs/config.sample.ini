# IP address to listen on, included IPV6
listen-address = 0.0.0.0:8082

# Default values for private and public keys. These can be overridden by each
# hostgroup section.

# You may omit them here to not set any default values, however each hostgroup
# then *must* specify them.
host-ca-privkey = /etc/oinit-ca/host-ca
host-ca-pubkey  = /etc/oinit-ca/host-ca.pub
user-ca-privkey = /etc/oinit-ca/user-ca
user-ca-pubkey  = /etc/oinit-ca/user-ca.pub

# Default value for the validity (valid before date) of issued certificates.
# This can be either set to "token" to inherit the validity from the expiry of
# the access token or a duration in seconds (6 hours = 21600 seconds).
cert-validity = 21600
; cert-validity = token

# Fallback certificate validity, in case the token does not contain an
# `exp`iry claim (e.g. google)
# default: 300 (5 min)
cert-validity-fallback = 1800

# Default value for the duration (in seconds) that responses from motley_cue
# are cached for. Here: 600s = 10min
cache-duration = 600

# Whether to provision a local user account via motley_cue.
# When false, motley_cue is still called to validate the token (via
# /user/get_status instead of /user/deploy), but no account is provisioned.
# Requires default-user to be set.
# Default: true
;provision-user = true

# Fixed username to use when provision-user is false.
# Used as the certificate username and for $provisioned-user substitution
# in cert-principals and force-command.
;default-user = git

# Space-separated list of certificate principals (usernames allowed to log in).
# $provisioned-user is replaced with the username from motley_cue (or
# default-user when provisioning is disabled).
# Default: oinit $provisioned-user
;cert-principals = oinit $provisioned-user

# Whether certificates whose resolved username is "root" may be issued for this
# host group.
#
# SECURITY RELEVANT: this permits federated login as the root account. It is
# denied by default. For a root login to actually succeed, the target server's
# oinit-switch and PAM configuration must also permit the oinit -> root switch.
# Default: false
;allow-root = false

# Require a specific audience ("aud" claim) in the access token.
#
# SECURITY RELEVANT: when set, a JWT access token is only accepted if its "aud"
# claim contains this value, mitigating replay of a token that was minted for a
# different relying party. The token's signature is always verified against the
# issuer's JWKS first.
#
# Caveat: this is only enforced for JWT access tokens. Opaque (non-JWT) tokens
# carry no audience the CA can inspect and are NOT rejected by this option; they
# are still validated via motley_cue. Leave unset to accept any audience.
# Default: unset (no audience check)
;require-token-aud = https://oinit-ca.example.com

# force-command set in the certificate's critical options.
#
# SECURITY RELEVANT, please only change if you know what you're doing
#
# $cert-principals is replaced with the resolved space-separated principals.
# $provisioned-user is replaced with the resolved username.
# Set to empty string to disable force-command.
# Default: oinit-switch $cert-principals
;force-command = oinit-switch $cert-principals

# This is a hostgroup named "example.com". The name is intended for humans and
# is not used by the CA.
[example.com]
# This hostgroup contains a single OpenSSH host for which the motley_cue REST
# API instance runs on port 8443.
# <ssh-host> = <motley_cue-url>
login.example.com = https://login.example.com:8443

# Wildcard matching is supported using an asterisk:
#*.example.com = https://login.example.com:8443

# As an example, this hostgroup could override the host-ca private and public
# keys like this:
#host-ca-privkey = /etc/ssh/example.com/host-ca
#host-ca-pubkey  = /etc/ssh/example.com/host-ca.pub

# Example: Git hosting setup
# No local account provisioning, all users authenticate as "git".
#[git.example.com]
#git.example.com = https://git.example.com:8443
#provision-user = false
#default-user = git
#cert-principals = git
