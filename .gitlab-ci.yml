---
include:
  - project: 'm-team/tools/ci-voodoo'
    ref: 'master'
    file: 'ci-include/pipeline-jobs-publish-to-repo.yml'

variables:
  USE_GORELEASER: "true"
  GIT_STRATEGY: clone

image: golang:1.25

stages:
  - build
  - test
  - lint
  - package
  - integration
  - publish

default:
  tags:
    - linux
  cache:
    paths:
      - .cache

before_script:
  - mkdir -p .cache
  - export GOPATH=${CI_PROJECT_DIR}/.cache

test:
  stage: test
  script:
    - go test -v ./...

test-race:
  stage: test
  script:
    - go test -race -v ./...

staticcheck:
  stage: lint
  allow_failure: true
  before_script:
    - go install honnef.co/go/tools/cmd/staticcheck@latest
  script:
    - staticcheck ./...

vet:
  stage: lint
  allow_failure: true
  script:
    - go vet ./...

oinit:
  stage: build
  script:
    - make oinit

oinit-ca:
  stage: build
  script:
    - make oinit-ca

oinit-shell:
  stage: build
  script:
    - make oinit-shell

oinit-switch:
  stage: build
  script:
    - make oinit-switch

package:
  stage: package
  # Run goreleaser natively (no nested "docker run"). The package stage needs
  # no Docker daemon: the dockers section in .goreleaser.yaml is disabled and
  # the job passes --skip docker. Running natively also means goreleaser sees
  # the real CI checkout (with its .git and .goreleaser.yaml) instead of an
  # empty bind-mount resolved by a daemon that cannot see $CI_PROJECT_DIR.
  image:
    name: goreleaser/goreleaser:latest
    entrypoint: [""]
  # only:
  #   refs:
  #     - tags
  #     - prerelease
  tags:
    - linux
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
    REPO_HOST: repo.data.kit.edu
    REPO_USER: cicd
  before_script:
    - apk add --no-cache bash git
    # goreleaser now runs git natively in the checkout; avoid "dubious
    # ownership" failures when the workdir is owned by a different uid.
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
  script:
    - |
      echo "CI_COMMIT_TAG: $CI_COMMIT_TAG"
      echo "CI_COMMIT_REF_NAME: $CI_COMMIT_REF_NAME"
      echo "PREREL_BRANCH_NAME: $PREREL_BRANCH_NAME"
      echo "CI_DEFAULT_BRANCH: $CI_DEFAULT_BRANCH"

      [[ "$CI_COMMIT_REF_NAME" == "${PREREL_BRANCH_NAME}" ]] && {
          echo "Running set-prerel-version"
          .gitlab-ci-scripts/set-prerel-version.sh
      }
      [[ "$CI_COMMIT_REF_NAME" != "${PREREL_BRANCH_NAME}" ]] && {
          [[ "$CI_COMMIT_REF_NAME" != "${CI_DEFAULT_BRANCH}" ]] && {
              # we're on a devel branch
              echo "Running set-devel-version"
              .gitlab-ci-scripts/set-prerel-version.sh --devstring dev
          }
      }
      .gitlab-ci-scripts/goreleaser.sh
  artifacts:
    paths:
      - "results/*"

# Publish the macOS/Linux client via Homebrew. Runs a full goreleaser release:
# it creates a GitLab Release, uploads the archives to this project's generic
# Package Registry (the cask's download source), and pushes the generated cask
# to the Homebrew tap.
#
# Branch-driven: this repo's releases are branch-driven (the ci-voodoo workflow
# does not create tag pipelines). goreleaser still needs a tag to publish, so we
# reuse the same version synthesis as the `package` job: on the default branch a
# real release tag is expected; on other branches a prerelease version+tag is
# synthesised (set-prerel-version.sh), which goreleaser treats as a prerelease -
# so skip_upload:auto leaves the Homebrew tap untouched until a real release.
#
# While Homebrew is being developed this runs on every branch so the job can be
# iterated on. Once stable, narrow `only:` to the default branch, e.g.:
#   only:
#     refs:
#       - master
#
# Requires:
#   - CI_JOB_TOKEN (automatic): GitLab release + Package Registry upload
#     (goreleaser uses it via gitlab_urls.use_job_token in .goreleaser.yaml).
#   - HOMEBREW_TAP_TOKEN (masked CI/CD variable, Settings -> CI/CD -> Variables):
#     a token with write access to the Homebrew tap repository.
homebrew:
  stage: publish
  # branches + merge_requests: the ci-voodoo workflow runs an MR pipeline
  # (not a branch pipeline) when a branch has an open merge request, so listing
  # only "branches" would silently skip the job in that case. Once stable,
  # narrow this to the default branch.
  only:
    refs:
      - branches
      - merge_requests
  image:
    name: goreleaser/goreleaser:latest
    entrypoint: [""]
  tags:
    - linux
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  before_script:
    - apk add --no-cache bash git
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    # goreleaser selects the release provider (GitLab) from GITLAB_TOKEN and uses
    # it to create the GitLab Release. use_job_token: true in .goreleaser.yaml
    # tells goreleaser this value is a CI job token. (HOMEBREW_TAP_TOKEN, set as
    # a CI/CD variable, authenticates the separate push to the GitHub tap.)
    - export GITLAB_TOKEN="$CI_JOB_TOKEN"
  script:
    - |
      [[ "$CI_COMMIT_REF_NAME" == "${PREREL_BRANCH_NAME}" ]] && {
          echo "Running set-prerel-version"
          .gitlab-ci-scripts/set-prerel-version.sh
      }
      [[ "$CI_COMMIT_REF_NAME" != "${PREREL_BRANCH_NAME}" ]] && {
          [[ "$CI_COMMIT_REF_NAME" != "${CI_DEFAULT_BRANCH}" ]] && {
              echo "Running set-devel-version"
              .gitlab-ci-scripts/set-prerel-version.sh --devstring dev
          }
      }
      goreleaser release --clean --skip docker
