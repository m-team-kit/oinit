version: 2
release:
  draft: true
  prerelease: auto

# Self-hosted GitLab (codebase.helmholtz.cloud) is the release target when
# goreleaser runs in GitLab CI (release provider is auto-detected from the git
# remote). Archives are uploaded to the project's generic Package Registry,
# which gives stable, public download URLs that the Homebrew cask points at, so
# the client is distributed entirely from GitLab - no GitHub dependency for the
# binaries. use_job_token lets CI_JOB_TOKEN create the release and upload the
# packages; if that token lacks permission, set a GITLAB_TOKEN (api scope)
# instead.
gitlab_urls:
  api: https://codebase.helmholtz.cloud/api/v4
  download: https://codebase.helmholtz.cloud
  use_package_registry: true
  use_job_token: true

dist: results
builds:
  - id: oinit
    main: ./cmd/oinit
    binary: oinit
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - freebsd
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{.CommitTimestamp}}"

  - id: oinit-ca
    main: ./cmd/oinit-ca
    binary: oinit-ca
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - freebsd
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{.CommitTimestamp}}"

  - id: oinit-shell
    main: ./cmd/oinit-shell
    binary: oinit-shell
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - freebsd
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{.CommitTimestamp}}"

  - id: oinit-switch
    main: ./cmd/oinit-switch
    binary: oinit-switch
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - freebsd
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.CommitDate}} -X main.builtBy=goreleaser
    mod_timestamp: "{{.CommitTimestamp}}"

archives:
  - id: bundle
    formats: ["tar.gz"]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

nfpms:
  - id: oinit
    package_name: oinit
    ids:
      - oinit
    homepage: https://codebase.helmholtz.cloud/m-team/oidc/ssh/oinit/
    maintainer: Marcus Hardt <hardt@kit.edu>
    description: |-
      Command-line client tool to use ssh-certificates with openssh
      oinit is a set of tools to integrate federated identities with 
      ssh-certificates. This client tool uses OpenID Connect to
      authenticate with the REST interface the oinit-ca.
    license: MIT
    contents:
      - src: copyright
        dst: /usr/share/doc/{{ .PackageName }}/copyright
    section: misc
    formats:
      - apk
      - deb
      - rpm
      - archlinux
    provides:
      - oinit
    overrides:
      deb:
        dependencies:
          - openssh-client
        recommends:
          - oidc-agent
      rpm:
        dependencies:
          - openssh-clients
        recommends:
          - oidc-agent
      apk:
        dependencies:
          - openssh-client
          # oidc-agent is not packaged for Alpine
      archlinux:
        dependencies:
          - openssh
          # oidc-agent is not packaged for Arch Linux
    deb:
      lintian_overrides:
        - statically-linked-binary
        - changelog-file-missing-in-native-package

  - id: oinit-ca
    package_name: oinit-ca
    ids:
      - oinit-ca
    homepage: https://codebase.helmholtz.cloud/m-team/oidc/ssh/oinit/
    maintainer: Marcus Hardt <hardt@kit.edu>
    description: |-
      Certificate authority for oinit command-line tool
      oinit is a set of tools to integrate federated identities with
      ssh-certificates. This is the CA package, which uses the openssh
      ssh-ca and adds a REST interface, which allows federated users to
      authenticate using their federated identity via OpenID Connect.
    license: MIT
    section: misc
    formats:
      - apk
      - deb
      - rpm
      - archlinux
    provides:
      - oinit-ca
    bindir: /usr/sbin
    contents:
      - src: copyright
        dst: /usr/share/doc/{{ .PackageName }}/copyright
      - src: configs/config.sample.ini
        dst: /etc/oinit/ca-config.ini
        type: config
      - src: init/oinit-ca-packaged.service
        dst: /usr/lib/systemd/system/oinit-ca.service
      - src: configs/nginx.oinit-ca.conf
        dst: /etc/nginx/location.d/nginx.oinit-ca.conf
    scripts:
      postinstall: "scripts/oinit-ca-postinstall.sh"
      preremove: "scripts/oinit-ca-preremove.sh"
    deb:
      lintian_overrides:
        - statically-linked-binary
        - changelog-file-missing-in-native-package

  - id: oinit-openssh
    package_name: oinit-openssh
    ids:
      - oinit-switch
      - oinit-shell
    homepage: https://codebase.helmholtz.cloud/m-team/oidc/ssh/oinit/
    maintainer: Marcus Hardt <hardt@kit.edu>
    description: |-
      oinit programs to integrate with OpenSSH
      oinit is a set of tools to integrate federated identities with
      ssh-certificates. This is the serverside package, which supports
      mapping the federated user to the corresponding user in the
      ssh-certificate.
    license: MIT
    contents:
      - src: copyright
        dst: /usr/share/doc/{{ .PackageName }}/copyright
      - src: configs/oinit-switch.sample.conf
        dst: /etc/oinit/oinit-switch.conf
        type: config
      - dst: /var/oinit-shell
        type: dir
    section: misc
    formats:
      - apk
      - deb
      - rpm
      - archlinux
    provides:
      - oinit-openssh
    bindir: /usr/bin
    overrides:
      deb:
        dependencies:
          - libcap2-bin
        recommends:
          - openssh-server
          - motley-cue
      rpm:
        dependencies:
          - libcap
        recommends:
          - openssh-server
          - util-linux
          - motley-cue
      apk:
        dependencies:
          - libcap
        recommends:
          - openssh
          - util-linux
          # motley-cue is not packaged for Alpine
      archlinux:
        dependencies:
          - libcap
        recommends:
          - openssh
          - util-linux
          # motley-cue is not packaged for Arch Linux
    scripts:
      postinstall: "scripts/oinit-openssh-postinstall.sh"
      preremove: "scripts/oinit-openssh-preremove.sh"
    deb:
      lintian_overrides:
        - statically-linked-binary
        - changelog-file-missing-in-native-package

homebrew_casks:
  # Homebrew cask for the macOS client only. oinit-ca, oinit-shell and
  # oinit-switch are Linux-only server components (PAM/su/systemd) and are not
  # offered via Homebrew. (goreleaser casks are macOS-only and pull the darwin
  # archives automatically.)
  - name: oinit
    # Archive id to source the cask from. The (single) archive bundles all
    # binaries; binaries: below installs only the client from it.
    ids:
      - bundle
    binaries:
      - oinit
    # Download URL for the archive: the GitLab generic Package Registry of this
    # project (populated by the GitLab release above). This keeps the binary
    # distribution on codebase.helmholtz.cloud. CI_API_V4_URL and CI_PROJECT_ID
    # are provided automatically by GitLab CI.
    url:
      template: "{{ .Env.CI_API_V4_URL }}/projects/{{ .Env.CI_PROJECT_ID }}/packages/generic/{{ .ProjectName }}/{{ .Tag }}/{{ .ArtifactName }}"
    # The tap is a separate Git repository named homebrew-<x> that goreleaser
    # pushes the generated Casks/oinit.rb into during `goreleaser release`. The
    # tap repo must exist. Users then install with:
    #   brew install KIT-SCC/oinit/oinit
    repository:
      owner: KIT-SCC
      name: homebrew-oinit
      # PAT (or GitHub App token) with contents:write on the tap repo. In GitLab
      # CI this is a masked CI/CD variable, read from the environment here.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: "https://codebase.helmholtz.cloud/m-team/oidc/ssh/oinit/"
    description: "Client to use SSH certificates with OpenSSH via OpenID Connect"
    # Don't try to push a cask for snapshot/prerelease/dirty builds.
    skip_upload: auto
    commit_author:
      name: goreleaser
      email: noreply@kit.edu
    hooks:
      post:
        # The binary is not code-signed/notarized, so strip the Gatekeeper
        # quarantine attribute on install to avoid "cannot be opened because the
        # developer cannot be verified". Proper signing/notarization (Apple
        # Developer ID) would remove the need for this.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/oinit"]
          end

